<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-200 min-h-screen flex flex-col items-center p-6">

    <h1 class="text-4xl font-bold text-red-600 mb-6">Pokedex</h1>

    <!-- Filtros de búsqueda -->
    <div class="w-full flex flex-col md:flex-row justify-center items-center gap-4 mt-6 mb-12">
        <input type="text" id="nameFilter" placeholder="Buscar por nombre" class="w-full border p-2 rounded-lg">
        <input type="number" id="idFilter" placeholder="Buscar por ID" class="w-full border p-2 rounded-lg">
        <select id="typeFilter" class="w-full border p-2 rounded-lg">
            <option value="">Todos los tipos</option>
            <option value="fire">Fuego</option>
            <option value="water">Agua</option>
            <option value="grass">Planta</option>
            <option value="electric">Eléctrico</option>
            <option value="psychic">Psíquico</option>
            <option value="rock">Roca</option>
            <option value="ground">Tierra</option>
            <option value="bug">Bicho</option>
            <option value="ghost">Fantasma</option>
            <option value="dragon">Dragón</option>
        </select>
        <button id="searchBtn"
            class="w-full bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Buscar</button>
        <button id="clearBtn"
            class="w-full bg-gray-400 text-white px-4 py-2 rounded-lg hover:bg-gray-500">Limpiar</button>
    </div>

    <!-- Contenedor de Tarjetas -->
    <div id="pokemon-container" class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 w-full max-w-6xl">
    </div>

    <div class="flex justify-center mt-8 space-x-4">
        <button id="first" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">Inicio</button>
        <button id="prev" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded" disabled>Anterior</button>
        <button id="next" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded" disabled>Siguiente</button>
        <button id="last" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded disabled">Final</button>
    </div>

    <!-- Modal de infromación -->
    <div id="pokeModal" class="fixed inset-0 bg-blue-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-lg p-6 w-80 relative">
            <button id="closeModal" class="absolute top-5 right-5 text-black hover:text-red-600 font-bold">X</button>
            <img id="imgModal" src="" alt="pokemon" class="w-40 h-40 mx-auto hover:scale-105 transition-transfrom">
            <h2 id="nameModal" class="text-2xl font-bold capitalize text-center mt-2 hover:text-blue-600"></h2>
            <p id="idModal" class="text-xl text-center font-bold text-gray-500 mb-2 hover:scale-105 transition-transfrom"></p>
            <p id="typesModal" class="text-center mb-2 hover:font-bold"></p>
            <p id="heightModal" class="text-center mb-2 hover:font-bold"></p>
            <p id="weightModal" class="text-center mb-2 hover:font-bold"></p>
            <p id="abilitiesModal" class="text-center mb-2 hover:font-bold"></p>
            <p id="movesModal" class="text-center mb-2 hover:font-bold"></p>
        </div>
    </div>



    
    <script src="./main.js"></script>
</body>

</html>
